# Tier 2 error-injection mutation B -- malformed if: condition.
# Copy of tests/fixtures/checkout_check_dist.yml with one change: the
# upload-artifact step's `if:` expression has its `==` comparison left
# dangling with no right-hand operand (syntactically incomplete, not just
# an unrecognized-but-valid pattern).
# See evaluation/tier2_error_injection/REPORT.md for the observed outcome.
name: Check dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the index.js file
        run: npm run build

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi

      # If dist/ was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.diff.conclusion == }}
        with:
          name: dist
          path: dist/

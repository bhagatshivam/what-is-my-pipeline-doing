# Tier 2 error-injection mutation C -- malformed secret reference.
# Copy of tests/fixtures/checkout_check_dist.yml with one change: the
# check-dist job declares an env var referencing `secret.DEPLOY_TOKEN`
# (singular "secret.", a typo of the real "secrets." context) instead of
# `secrets.DEPLOY_TOKEN`.
# See evaluation/tier2_error_injection/REPORT.md for the observed outcome.
name: Check dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TOKEN: ${{ secret.DEPLOY_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the index.js file
        run: npm run build

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi

      # If dist/ was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/
